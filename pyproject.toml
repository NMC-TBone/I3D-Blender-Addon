[project]
name = "i3dio"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = [
  "N801",  # Blender-style class names (e.g., SOMETHING_OT_Something) violate CapWords
]

[tool.ruff.lint.isort]
order-by-type = true

[tool.ruff.format]
quote-style = "preserve"
